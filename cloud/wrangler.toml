name = "touchline-studio"
pages_build_output_dir = "../dist"
compatibility_date = "2026-11-03"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "touchline-studio"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
CF_ACCESS_TEAM_DOMAIN = "REPLACE_WITH_CLOUDFLARE_ACCESS_TEAM_DOMAIN"
CF_ACCESS_AUD = "REPLACE_WITH_CLOUDFLARE_ACCESS_AUDIENCE_TAG"
R2_ACCOUNT_ID = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"
R2_BUCKET = "touchline-studio-private"
MODAL_API_URL = "REPLACE_WITH_MODAL_WEB_API_URL"
